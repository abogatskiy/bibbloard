name: Backfill Alternative from Wayback

# One-off: runs on pushes to this branch only. Remove before merging.
on:
  push:
    branches: [backfill/alternative-wayback]

jobs:
  backfill:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install scraper dependency
        run: pip3 install billboard.py

      - name: Backfill missing weeks
        timeout-minutes: 30
        run: python3 backfill_alternative_wayback.py

      - name: Commit recovered data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add raw/alternative.csv
          if git diff --cached --quiet; then
            echo "No weeks recovered"
          else
            git commit -m "data: backfill Alternative chart weeks from the Wayback Machine"
            git push
          fi
